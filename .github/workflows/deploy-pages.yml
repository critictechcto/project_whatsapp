name: Deploy landing page to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      # The typed API client is generated from the backend schema.
      - 'backend/openapi.yml'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

# Only one deployment at a time; a newer push cancels an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # Served from the custom domain root (upchatz.com, see frontend/public/CNAME).
      # Without a custom domain Pages serves /<repo>/: use VITE_BASE=/<repo>/ instead.
      VITE_BASE: /
      # No backend on Pages: the dashboard at /app runs on seeded demo data (MSW).
      VITE_API_MODE: mock
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # eslint, vitest, then tsc --noEmit, vite build and the landing page prerender
      - run: npm run lint && npm test && npm run build

      # dist/index.html holds the prerendered landing page; every other path gets dist/shell.html,
      # the same document with an empty root.
      # Pages has no SPA fallback: serve the app shell for deep links such as /app/login.
      - run: cp dist/shell.html dist/404.html

      # The 404.html fallback answers with HTTP 404, which Meta or Razorpay reviewers may reject for a
      # privacy policy URL. Real files for the static pages make /privacy/, /terms/ and /contact/ return 200.
      - run: |
          for page in privacy terms contact; do
            mkdir -p "dist/$page"
            cp dist/shell.html "dist/$page/index.html"
          done

      # robots.txt and sitemap.xml come from public/; fail rather than let them fall back to the app.
      - run: test -f dist/robots.txt && test -f dist/sitemap.xml

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
