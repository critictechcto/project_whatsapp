name: Deploy landing page to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      # The typed API client is generated from the backend schema.
      - 'backend/openapi.yml'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

# Only one deployment at a time; a newer push cancels an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # GitHub Pages serves this project under /<repo>/. With a custom domain, use VITE_BASE=/.
      VITE_BASE: /project_whatsapp_landing_page/
      # No backend on Pages: the dashboard at /app runs on seeded demo data (MSW).
      VITE_API_MODE: mock
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # eslint, vitest, then tsc --noEmit && vite build
      - run: npm run lint && npm test && npm run build

      # Pages has no SPA fallback: serve the app shell for deep links such as /app/login.
      - run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
