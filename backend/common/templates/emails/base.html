<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>{% block title %}{{ brand }}{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f4f1;">
<div style="display:none;max-height:0;overflow:hidden;">{% block preheader %}{% endblock %}</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f4f4f1;">
  <tr>
    <td align="center" style="padding:32px 16px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;">
        <tr>
          <td style="padding:0 4px 16px 4px;font-family:Arial,Helvetica,sans-serif;font-size:20px;font-weight:bold;letter-spacing:-0.3px;color:#16181d;">{{ brand }}</td>
        </tr>
        <tr>
          <td style="background-color:#ffffff;border:1px solid #e3e3de;border-radius:8px;padding:32px 28px;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:24px;color:#16181d;">
{% block content %}{% endblock %}
          </td>
        </tr>
        <tr>
          <td style="padding:16px 4px 0 4px;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:18px;color:#5f636b;">You received this email because {% block reason %}you have an account with {{ brand }}{% endblock %}. &middot; {{ brand }} &middot; <a href="mailto:{{ support_email }}" style="color:#5f636b;">{{ support_email }}</a></td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
