  /api/v1/templates/:
    get:
      operationId: templates_list
      description: |-
        WhatsApp message templates of the header workspace.

        Created as local drafts, then submitted to Meta for review. Drafts and rejected templates can
        be edited; everything else is read-only until Meta changes its status.
      parameters:
      - in: header
        name: X-Workspace-ID
        schema:
          type: string
          format: uuid
        description: Workspace to act in. The caller must be a member.
        required: true
      - in: query
        name: category
        schema:
          type: string
          enum:
          - AUTHENTICATION
          - MARKETING
          - UTILITY
        description: |-
          * `MARKETING` - Marketing
          * `UTILITY` - Utility
          * `AUTHENTICATION` - Authentication
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: query
        name: language
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - APPROVED
          - ARCHIVED
          - DELETED
          - DISABLED
          - DRAFT
          - IN_APPEAL
          - LIMIT_EXCEEDED
          - PAUSED
          - PENDING
          - PENDING_DELETION
          - REJECTED
        description: |-
          * `DRAFT` - Draft
          * `PENDING` - Pending review
          * `APPROVED` - Approved
          * `REJECTED` - Rejected
          * `PAUSED` - Paused
          * `DISABLED` - Disabled
          * `IN_APPEAL` - In appeal
          * `PENDING_DELETION` - Pending deletion
          * `DELETED` - Deleted
          * `LIMIT_EXCEEDED` - Limit exceeded
          * `ARCHIVED` - Archived
      - in: query
        name: waba
        schema:
          type: string
          format: uuid
      tags:
      - templates
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMessageTemplateList'
          description: ''
    post:
      operationId: templates_create
      description: |-
        WhatsApp message templates of the header workspace.

        Created as local drafts, then submitted to Meta for review. Drafts and rejected templates can
        be edited; everything else is read-only until Meta changes its status.
      parameters:
