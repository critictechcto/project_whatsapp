openapi: 3.0.3
info:
  title: UpChatz API
  version: 1.0.0
  description: Multi-tenant WhatsApp Business Platform (Cloud API) for Indian businesses.
paths:
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Blacklist a refresh token.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenBlacklistRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenBlacklistRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenBlacklistRequest'
        required: true
      responses:
        '200':
          description: No response body
  /api/v1/auth/me/:
    get:
      operationId: auth_me_retrieve
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
    patch:
      operationId: auth_me_partial_update
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMeRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/auth/password/change/:
    post:
      operationId: auth_password_change_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/register/:
    post:
      operationId: auth_register_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
          description: ''
  /api/v1/auth/token/:
    post:
      operationId: auth_token_create
      description: Exchange email + password for an access/refresh token pair.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/v1/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: Rotate a refresh token. The old refresh token is blacklisted.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/automations/business-hours/:
    get:
      operationId: automations_business_hours_retrieve
      description: The workspace's business hours (one per workspace).
      parameters:
      - in: header
        name: X-Workspace-ID
        schema:
          type: string
          format: uuid
        description: Workspace to act in. The caller must be a member.
        required: true
      tags:
      - automations
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessHours'
          description: ''
    patch:
      operationId: automations_business_hours_partial_update
      description: The workspace's business hours (one per workspace).
      parameters:
      - in: header
        name: X-Workspace-ID
        schema:
          type: string
          format: uuid
        description: Workspace to act in. The caller must be a member.
        required: true
      tags:
      - automations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBusinessHoursRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedBusinessHoursRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedBusinessHoursRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessHours'
          description: ''
  /api/v1/automations/rules/:
    get:
      operationId: automations_rules_list
      description: Rules that react to inbound messages, e.g. keyword auto-replies.
      parameters:
      - in: header
        name: X-Workspace-ID
        schema:
          type: string
          format: uuid
        description: Workspace to act in. The caller must be a member.
        required: true
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: query
        name: is_active
        schema:
          type: boolean
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: trigger
        schema:
          type: string
          enum:
          - first_inbound
          - keyword
          - new_contact
          - outside_business_hours
      tags:
      - automations
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAutomationRuleList'
          description: ''
    post:
      operationId: automations_rules_create
      description: Rules that react to inbound messages, e.g. keyword auto-replies.
      parameters:
      - in: header
        name: X-Workspace-ID
        schema:
          type: string
          format: uuid
        description: Workspace to act in. The caller must be a member.
        required: true
      tags:
      - automations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutomationRuleRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AutomationRuleRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AutomationRuleRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutomationRule'
          description: ''
  /api/v1/automations/rules/{id}/:
    get:
      operationId: automations_rules_retrieve
      description: Rules that react to inbound messages, e.g. keyword auto-replies.
      parameters:
      - in: header
        name: X-Workspace-ID
        schema:
          type: string
          format: uuid
        description: Workspace to act in. The caller must be a member.
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - automations
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutomationRule'
          description: ''
    patch:
      operationId: automations_rules_partial_update
      description: Rules that react to inbound messages, e.g. keyword auto-replies.
      parameters:
      - in: header
        name: X-Workspace-ID
        schema:
          type: string
          format: uuid
        description: Workspace to act in. The caller must be a member.
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - automations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAutomationRuleRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAutomationRuleRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAutomationRuleRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutomationRule'
          description: ''
    delete:
      operationId: automations_rules_destroy
      description: Rules that react to inbound messages, e.g. keyword auto-replies.
      parameters:
      - in: header
        name: X-Workspace-ID
        schema:
          type: string
          format: uuid
        description: Workspace to act in. The caller must be a member.
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - automations
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/automations/runs/:
    get:
      operationId: automations_runs_list
      description: History of rule executions.
      parameters:
      - in: header
        name: X-Workspace-ID
        schema:
          type: string
          format: uuid
        description: Workspace to act in. The caller must be a member.
        required: true
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: rule
        schema:
          type: string
          format: uuid
        description: Rule id.
      - in: query
        name: status
        schema:
          type: string
          enum:
          - failed
          - skipped
          - succeeded
      tags:
      - automations
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAutomationRunList'
          description: ''
  /api/v1/billing/billing-profile/:
    get:
      operationId: billing_profile_retrieve
      description: Details printed on GST invoices. Admins can read it; only the owner
        can change it.
      parameters:
      - in: header
        name: X-Workspace-ID
        schema:
          type: string
          format: uuid
        description: Workspace to act in. The caller must be a member.
        required: true
      tags:
      - billing
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingProfile'
          description: ''
    patch:
      operationId: billing_profile_partial_update
      description: Details printed on GST invoices. Admins can read it; only the owner
        can change it.
      parameters:
      - in: header
        name: X-Workspace-ID
        schema:
          type: string
          format: uuid
        description: Workspace to act in. The caller must be a member.
        required: true
      tags:
      - billing
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBillingProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedBillingProfileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedBillingProfileRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingProfile'
          description: ''
  /api/v1/billing/invoices/:
    get:
      operationId: billing_invoices_list
      description: Compose with DRF mixins (ListModelMixin, ...) for partial CRUD.
      parameters:
      - in: header
        name: X-Workspace-ID
        schema:
          type: string
          format: uuid
        description: Workspace to act in. The caller must be a member.
        required: true
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - billing
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedInvoiceList'
          description: ''
  /api/v1/billing/plans/:
    get:
      operationId: billing_plans_list
      description: Plans a workspace can subscribe to (prices before GST).
      parameters:
      - in: header
        name: X-Workspace-ID
        schema:
          type: string
          format: uuid
        description: Workspace to act in. The caller must be a member.
        required: true
      tags:
      - billing
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Plan'
          description: ''
  /api/v1/billing/subscription/:
    get:
      operationId: billing_subscription_retrieve
      description: The workspace's subscription; changes are owner-only.
      parameters:
      - in: header
        name: X-Workspace-ID
        schema:
          type: string
          format: uuid
        description: Workspace to act in. The caller must be a member.
        required: true
      tags:
      - billing
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
          description: ''
  /api/v1/billing/subscription/cancel/:
    post:
      operationId: billing_subscription_cancel_create
      description: The workspace's subscription; changes are owner-only.
      parameters:
      - in: header
        name: X-Workspace-ID
        schema:
          type: string
          format: uuid
        description: Workspace to act in. The caller must be a member.
        required: true
      tags:
      - billing
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelSubscriptionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CancelSubscriptionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CancelSubscriptionRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
          description: ''
  /api/v1/billing/subscription/checkout/:
    post:
      operationId: billing_subscription_checkout_create
      description: Create a Razorpay subscription and return options for Razorpay
        Checkout.
      parameters:
      - in: header
        name: X-Workspace-ID
        schema:
          type: string
          format: uuid
        description: Workspace to act in. The caller must be a member.
        required: true
      tags:
      - billing
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutSession'
          description: ''
  /api/v1/billing/subscription/verify/:
    post:
      operationId: billing_subscription_verify_create
      description: Verify the Checkout signature. Status may stay pending until the
        webhook.
      parameters:
      - in: header
        name: X-Workspace-ID
        schema:
          type: string
          format: uuid
        description: Workspace to act in. The caller must be a member.
        required: true
      tags:
      - billing
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutVerifyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CheckoutVerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CheckoutVerifyRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
          description: ''
  /api/v1/billing/usage/:
    get:
      operationId: billing_usage_retrieve
      description: Current usage against the plan's limits.
      parameters:
      - in: header
        name: X-Workspace-ID
        schema:
          type: string
          format: uuid
        description: Workspace to act in. The caller must be a member.
        required: true
      tags:
      - billing
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usage'
          description: ''
  /api/v1/campaigns/:
    get:
      operationId: campaigns_list
      description: Bulk template sends to an audience of opted-in contacts.
      parameters:
      - in: header
        name: X-Workspace-ID
        schema:
          type: string
          format: uuid
        description: Workspace to act in. The caller must be a member.
        required: true
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
          enum:
          - cancelled
          - completed
          - draft
          - failed
          - paused
          - running
          - scheduled
      tags:
      - campaigns
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCampaignList'
          description: ''
    post:
      operationId: campaigns_create
      description: Create a draft campaign.
      parameters:
      - in: header
        name: X-Workspace-ID
        schema:
          type: string
          format: uuid
        description: Workspace to act in. The caller must be a member.
        required: true
      tags:
      - campaigns
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CampaignWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CampaignWriteRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
          description: ''
  /api/v1/campaigns/{id}/:
    get:
      operationId: campaigns_retrieve
      description: Bulk template sends to an audience of opted-in contacts.
      parameters:
      - in: header
        name: X-Workspace-ID
        schema:
          type: string
          format: uuid
        description: Workspace to act in. The caller must be a member.
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - campaigns
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
          description: ''
    patch:
      operationId: campaigns_partial_update
      description: Only draft and scheduled campaigns can change (409 campaign_not_editable).
      parameters:
      - in: header
        name: X-Workspace-ID
        schema:
          type: string
          format: uuid
        description: Workspace to act in. The caller must be a member.
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - campaigns
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCampaignWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCampaignWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCampaignWriteRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
          description: ''
    delete:
      operationId: campaigns_destroy
      description: Only drafts can be deleted.
      parameters:
      - in: header
        name: X-Workspace-ID
        schema:
          type: string
          format: uuid
        description: Workspace to act in. The caller must be a member.
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - campaigns
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/campaigns/{id}/audience-preview/:
    post:
      operationId: campaigns_audience_preview_create
      description: Count who would receive the campaign and who would be skipped.
      parameters:
      - in: header
        name: X-Workspace-ID
        schema:
          type: string
          format: uuid
        description: Workspace to act in. The caller must be a member.
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - campaigns
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudiencePreview'
          description: ''
  /api/v1/campaigns/{id}/cancel/:
    post:
      operationId: campaigns_cancel_create
      description: Bulk template sends to an audience of opted-in contacts.
      parameters:
      - in: header
        name: X-Workspace-ID
        schema:
          type: string
          format: uuid
        description: Workspace to act in. The caller must be a member.
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - campaigns
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
          description: ''
  /api/v1/campaigns/{id}/launch/:
    post:
      operationId: campaigns_launch_create
      description: Schedule or start sending. The template must be approved by Meta.
      parameters:
      - in: header
        name: X-Workspace-ID
        schema:
          type: string
          format: uuid
        description: Workspace to act in. The caller must be a member.
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - campaigns
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LaunchCampaignRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LaunchCampaignRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LaunchCampaignRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
          description: ''
  /api/v1/campaigns/{id}/pause/:
    post:
      operationId: campaigns_pause_create
      description: Bulk template sends to an audience of opted-in contacts.
      parameters:
      - in: header
        name: X-Workspace-ID
