  /api/v1/contacts/:
    get:
      operationId: contacts_list
      description: Contacts of the header workspace. Consent changes only through
        opt-in/opt-out.
      parameters:
      - in: header
        name: X-Workspace-ID
        schema:
          type: string
          format: uuid
        description: Workspace to act in. The caller must be a member.
        required: true
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: query
        name: marketing_opt_in_status
        schema:
          type: string
          enum:
          - opted_in
          - opted_out
          - unknown
        description: |-
          * `unknown` - Unknown
          * `opted_in` - Opted in
          * `opted_out` - Opted out
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: tag
        schema:
          type: string
          format: uuid
        description: Tag id
      tags:
      - contacts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedContactList'
          description: ''
    post:
