          type: string
          format: uuid
        description: Workspace to act in. The caller must be a member.
        required: true
      tags:
      - templates
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageTemplateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MessageTemplateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MessageTemplateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageTemplate'
          description: ''
