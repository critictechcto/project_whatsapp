          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
          description: ''
    delete:
      operationId: workspaces_members_destroy
      description: Members of the header workspace. Anyone may leave; admins manage
        others.
      parameters:
      - in: header
        name: X-Workspace-ID
        schema:
          type: string
          format: uuid
        description: Workspace to act in. The caller must be a member.
        required: true
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9a-fA-F-]{36}$
        required: true
      tags:
      - workspaces
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
