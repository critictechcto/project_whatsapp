# Local Postgres + Redis for development. Django and Celery run on the host with uv.
#   docker compose -f infra/docker/compose.dev.yml up -d
name: upchatz

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: upchatz
      POSTGRES_PASSWORD: upchatz
      POSTGRES_DB: upchatz
    # Host port 5433 so it never collides with a locally installed PostgreSQL on 5432.
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U upchatz -d upchatz"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
